# Fairflow services metrics (scrape /metrics from each service)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  # Add service targets when running; example:
  # - job_name: fairflow-gateway
  #   static_configs:
  #     - targets: ['host.docker.internal:3000']
  # - job_name: fairflow-auth
  #   static_configs:
  #     - targets: ['host.docker.internal:3001']
